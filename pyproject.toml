[project]
name = "newtrackon"
version = "1.0.0"
requires-python = "==3.14.*"
dependencies = [
    "requests==2.34.2",
    "tornado==6.5.10",
    "Flask==3.1.3",
    "dnspython==2.8.0",
]

[dependency-groups]
dev = [
    "ruff",
    "basedpyright",
    "ty",
    "pytest",
    "pytest-cov",
    "freezegun",
    "djlint",
]

[tool.setuptools.packages.find]
exclude = ["data*"]

[tool.ruff]
line-length = 130
fix = true
unsafe-fixes = true

[tool.ruff.lint]
extend-select = ["UP", "Q", "G", "PLE", "PLC", "RUF"]
# Allow type validation to use the application's existing exception types.
ignore = ["TRY004"]

[tool.ruff.lint.per-file-ignores]
# Allow imports inside test functions for test isolation
"tests/**/*.py" = ["PLC0415"]

[tool.djlint]
profile = "jinja"
extension = "jinja"
max_line_length = 180
